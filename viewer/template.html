<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
/*__PDF_CSS__*/
:root{color-scheme:light dark;font:14px system-ui}*{box-sizing:border-box}body{margin:0;background:#343638;color:#f1f2f3;height:100vh;display:flex;flex-direction:column;overflow:hidden}.toolbar{flex-shrink:0;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:9px 12px;background:#202223;border-bottom:1px solid #555;flex-wrap:wrap}button,input{font:inherit;border:1px solid #626568;border-radius:5px;padding:5px 8px;background:#303335;color:inherit}button{cursor:pointer}button:disabled{opacity:.4}input[type=number]{width:64px}#search{width:140px}#message{margin:20px;white-space:pre-wrap}#scroll{overflow:auto;padding:20px;min-height:0;flex:1}#page{position:relative;margin:auto;background:white;box-shadow:0 3px 16px #0005}canvas{display:block}#page .textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial;transform-origin:0 0;z-index:2}#page .textLayer span,#page .textLayer br{position:absolute;color:transparent;white-space:pre;cursor:text;transform-origin:0 0}#password{padding:20px}#password[hidden]{display:none}button:focus-visible,input:focus-visible{outline:2px solid #56bc98;outline-offset:2px}
</style></head><body><div class="toolbar" role="toolbar" aria-label="PDF 도구">
<button type="button" id="prev" aria-label="이전 페이지">‹</button><input id="number" type="number" min="1" aria-label="페이지"><span id="count"></span><button type="button" id="next" aria-label="다음 페이지">›</button>
<button type="button" id="out" aria-label="축소">−</button><span id="zoom"></span><button type="button" id="in" aria-label="확대">+</button><button type="button" id="fit">너비 맞춤</button>
<input id="search" type="search" placeholder="문서 검색" aria-label="문서 검색"><button type="button" id="find">찾기</button><span id="found" role="status"></span>
</div><div id="password" hidden>암호가 필요한 PDF입니다. <input type="password" id="secret" aria-label="PDF 암호"><button type="button" id="unlock">열기</button></div><div id="message" role="status">PDF를 불러오는 중…</div><main id="scroll" aria-label="PDF 페이지"><div id="page"><canvas></canvas><div class="textLayer"></div></div></main>
<script>window.__PDF_DOCUMENT__={data:'__PDF_DATA__',page:__PDF_PAGE__,worker:'__PDF_WORKER__'};</script><script>__PDF_RUNTIME__</script></body></html>
